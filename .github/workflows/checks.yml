name: Checks

on: [push, pull_request]

jobs:
  test-lint:
    name: Test and Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare environment file
        run: cp .env.example .env
      - name: Test
        run: docker compose run --rm app sh -c "python manage.py wait_for_db && python manage.py test"
      - name: Check migrations
        run: docker compose run --rm app sh -c "python manage.py makemigrations --check --dry-run"
      - name: Check production deployment settings
        run: >-
          docker compose run --rm
          -e DJANGO_ENV=prod
          -e DJANGO_SECRET_KEY=ci-only-release-check-secret-with-more-than-fifty-random-characters
          -e DJANGO_ALLOWED_HOSTS=api.example.com
          -e CORS_ALLOWED_ORIGINS=https://app.example.com
          -e CSRF_TRUSTED_ORIGINS=https://app.example.com
          -e DB_PASS=ci-only-strong-database-password
          app sh -c "python manage.py check --deploy"
      - name: Lint
        run: docker compose run --rm app sh -c "flake8"
